services:
  mafia:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    restart: unless-stopped

  # Self-hosted LiveKit SFU for 7-16+ players on phones (runs with --profile sfu)
  livekit:
    image: livekit/livekit-server:latest
    profiles: ["sfu"]
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50050:50000-50050/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  # Optional: temporary HTTPS URL for remote friends
  # Run with: docker compose --profile tunnel up --build
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://mafia:3000
    depends_on:
      - mafia
